name = "bmw-individual-colors"
main = "worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
minify = true

[observability]
enabled = true
head_sampling_rate = 1

# Exposes the deployed version id; worker.ts puts it in edge-cache keys so a
# deploy never serves pages rendered by the previous code. Free.
[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "bmw-individual-colors"

[vars]
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAC6yXfM_xBBaAkKj"
